  <style>
    .ninebot-page { max-width: 1064px; margin: 0 auto; padding: 36px 32px; }
    .ninebot-card { min-height: 280px; padding: 38px 42px; border-radius: 24px; background: #f4f4f6; display: flex; align-items: center; justify-content: space-between; gap: 24px; overflow: hidden; }
    .ninebot-copy { flex: 1 0 auto; }
    .ninebot-copy h1 { margin: 0; font-size: clamp(25px, 3vw, 34px); line-height: 1.3; font-weight: 700; letter-spacing: -.03em; }
    .ninebot-copy p { margin: 10px 0 0; color: #777980; font-size: clamp(15px, 1.6vw, 19px); }
    .bike { width: min(42%, 370px); height: auto; flex: none; overflow: visible; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: wheel-turn 2s linear infinite; }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .wheel { animation: none; } }
    @media (max-width: 600px) {
      .ninebot-page { padding: 20px; }
      .ninebot-card { min-height: 0; padding: 30px 26px 24px; align-items: flex-start; flex-direction: column; gap: 12px; }
      .bike { width: min(100%, 320px); align-self: flex-end; }
    }
  </style>
