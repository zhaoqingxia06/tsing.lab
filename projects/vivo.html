<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>vivo 听力辅助 · Tsing</title>
  <meta name="description" content="Tsing 在 vivo 负责的听力辅助产品：语音转文字、环境音识别、手语翻译。" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css?v=29" />
  <link rel="stylesheet" href="../css/projects.css?v=2" />
  <script src="../js/project-tabs.js?v=1" defer></script>
</head>
<body>
  <main class="case-page case-page--products">
    <a class="case-back" href="../index.html#about"><span aria-hidden="true">←</span> 返回关于我</a>

    <div class="product-tabs" role="tablist" aria-label="vivo 产品" data-product-tabs>
      <button class="product-tab" type="button" role="tab" id="tab-speech-to-text" aria-controls="panel-speech-to-text" aria-selected="true" tabindex="0" data-product="speech-to-text">语音转文字</button>
      <button class="product-tab" type="button" role="tab" id="tab-sound-recognition" aria-controls="panel-sound-recognition" aria-selected="false" tabindex="-1" data-product="sound-recognition">环境音识别</button>

    </div>

    <!-- Replace each panel's case-empty block with the supplied product introduction. -->
    <section class="product-panel" role="tabpanel" id="panel-speech-to-text" aria-labelledby="tab-speech-to-text" tabindex="0">
      <h1 class="product-title">语音转文字</h1>
      <div class="case-empty">
        <p class="case-empty-title">产品介绍待补充</p>
        <p class="case-empty-note">详细介绍将在这里更新。</p>
      </div>
    </section>
    <section class="product-panel" role="tabpanel" id="panel-sound-recognition" aria-labelledby="tab-sound-recognition" tabindex="0" hidden>
      <h1 class="product-title">环境音识别</h1>
      <div class="case-empty">
        <p class="case-empty-title">产品介绍待补充</p>
        <p class="case-empty-note">详细介绍将在这里更新。</p>
      </div>
    </section>
    <section class="product-panel" role="tabpanel" id="panel-sign-language" aria-labelledby="tab-sign-language" tabindex="0" hidden>
      <h1 class="product-title">手语翻译</h1>
      <div class="case-empty">
        <p class="case-empty-title">产品介绍待补充</p>
        <p class="case-empty-note">详细介绍将在这里更新。</p>
      </div>
    </section>
