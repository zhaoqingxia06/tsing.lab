<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880">
  <title>玫红腮红角色 · 全身手绘版</title>
  <!-- 配色取自原图：皮肤 #FEE1D2 / 腮红 #AE2627 / 黑 #000000 / 白 #FFFFFF -->

  <!-- 裤腿与鞋子（先画，被裤子上端压住） -->
  <path d="M 266 716 L 266 796" stroke="#000000" stroke-width="42" stroke-linecap="round" fill="none"/>
  <path d="M 334 716 L 334 796" stroke="#000000" stroke-width="42" stroke-linecap="round" fill="none"/>
  <g transform="rotate(-5 272 803)">
    <rect x="234" y="807" width="76" height="12" rx="6" fill="#CFCFD4"/>
    <rect x="234" y="790" width="76" height="26" rx="12" fill="#FFFFFF"/>
  </g>
  <g transform="rotate(5 328 803)">
    <rect x="290" y="807" width="76" height="12" rx="6" fill="#CFCFD4"/>
    <rect x="290" y="790" width="76" height="26" rx="12" fill="#FFFFFF"/>
  </g>
  <!-- 裤子（短腿呆萌比例） -->
  <rect x="232" y="636" width="136" height="92" rx="28" fill="#000000"/>
  <!-- 高领衫衣身 -->
  <rect x="205" y="492" width="190" height="160" rx="56" fill="#000000"/>
  <!-- 袖子 + 露出的手（手圆心略低于袖口，被袖子包住上缘） -->
  <path d="M 215 512 L 185 660" stroke="#000000" stroke-width="46" stroke-linecap="round" fill="none"/>
  <path d="M 385 512 L 415 660" stroke="#000000" stroke-width="46" stroke-linecap="round" fill="none"/>
  <circle cx="185" cy="672" r="24" fill="#FEE1D2"/>
  <circle cx="415" cy="672" r="24" fill="#FEE1D2"/>
  <!-- 高领领口（上缘被下巴压住） -->
  <rect x="238" y="456" width="124" height="44" rx="20" fill="#000000"/>

  <!-- 脸（宽椭圆，比例取自原图：脸宽:脸高 ≈ 460:330） -->
  <ellipse cx="300" cy="337" rx="190" ry="137" fill="#FEE1D2"/>

  <!-- 腮红：两个大圆（瞳孔正下方偏外，不到脸宽三分之一） -->
  <circle cx="225" cy="378" r="48" fill="#AE2627"/>
  <circle cx="375" cy="378" r="48" fill="#AE2627"/>
  <!-- 小嘴（两腮红圆心连线上） -->
  <rect x="290" y="371" width="22" height="14" rx="7" fill="#AE2627"/>

  <!-- 眉毛：带轻微弧度 -->
  <path d="M 233 248 Q 258 238 281 242" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round"/>
  <path d="M 319 242 Q 342 238 367 248" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round"/>
  <!-- 眼睛：纵向椭圆，平静呆萌 -->
  <ellipse cx="237" cy="295" rx="12" ry="23" fill="#000000"/>
  <ellipse cx="363" cy="295" rx="12" ry="23" fill="#000000"/>

  <!-- 头发：圆顶 + 明显中分的刘海 -->
  <path d="M 114 218
           A 186 152 0 0 1 486 218
           Q 448 202 402 211
           Q 358 203 320 212
           Q 300 230 280 212
           Q 242 203 198 211
           Q 152 202 114 218 Z" fill="#000000"/>
  <!-- 两侧垂发（顶端伸进发块内防裂缝，尖端收在眉眼之间以上） -->
  <path d="M 112 198 C 104 238 108 272 130 310 C 142 315 156 309 162 298 C 152 266 150 230 162 194 Z" fill="#000000"/>
  <path d="M 488 198 C 496 238 492 272 470 310 C 458 315 444 309 438 298 C 448 266 450 230 438 194 Z" fill="#000000"/>
  <!-- 呆毛：三颗均匀对称的圆凸，底部沉进发块 -->
  <circle cx="245" cy="78" r="12.5" fill="#000000"/>
  <circle cx="300" cy="68" r="16" fill="#000000"/>
  <circle cx="355" cy="78" r="12.5" fill="#000000"/>
</svg>
